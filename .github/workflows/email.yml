name: Письма клиентам (раз в 30-45 мин)
on:
  schedule:
    - cron: "*/10 * * * *"   # проверка каждые 10 мин; сам скрипт шлёт не чаще раза в 30-45 мин
    - cron: "30 8 * * *"     # 12:30 по Баку, сразу после сброса дневного лимита Google: большой поиск
  workflow_dispatch:
    inputs:
      hunt:
        description: "Сначала большой поиск новых клиентов (все категории, 3 страницы) и их почты"
        type: boolean
        default: false
      drip:
        description: "Работать несколько часов подряд: каждые 5 мин проверять, не пора ли отправить следующее письмо"
        type: boolean
        default: false
      test:
        description: "Только проверить пароль: отправить тестовое письмо самому себе"
        type: boolean
        default: false
permissions:
  contents: write
  actions: write   # чтобы drip-запуск сам перезапускал себя (расписание GitHub срабатывает редко)
concurrency:
  group: leads-data          # не пересекаться с ежедневным поиском (оба пишут в data/)
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Есть ли пароль приложения Gmail?
        id: gate
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          if [ -n "$GMAIL_APP_PASSWORD" ]; then echo "on=1" >> "$GITHUB_OUTPUT"; else echo "Секрета GMAIL_APP_PASSWORD нет: письма выключены."; fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.on == '1'
      - name: Найти почту у пары лидов и отправить одно письмо
        if: steps.gate.outputs.on == '1'
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          if [ "${{ inputs.test }}" = "true" ]; then python3 email_outreach.py test; exit 0; fi
          if [ "${{ inputs.hunt }}" = "true" ] || [ "${{ github.event.schedule }}" = "30 8 * * *" ]; then bash hunt.sh force; fi
          python3 email_outreach.py find
          python3 email_outreach.py send
      - name: Сохранить, кому уже написали
        if: steps.gate.outputs.on == '1'
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          save() {
            git add data docs
            git diff --cached --quiet && return 0
            git commit -q -m "Письма: $(date -u +%F' '%H:%M) UTC"
            for i in 1 2 3; do git pull --rebase -q && git push -q && return 0; sleep 5; done
            return 1
          }
          git config user.name "autopilot"
          git config user.email "autopilot@users.noreply.github.com"
          save
          if [ "${{ inputs.drip }}" = "true" ]; then
            end=$(( $(date +%s) + 330*60 ))
            while [ "$(date +%s)" -lt "$end" ]; do
              sleep 300
              git pull --rebase -q || true
              bash hunt.sh || true
              save || true
              python3 email_outreach.py find || true
              python3 email_outreach.py send || true
              save || true
            done
            gh workflow run email.yml -f drip=true || echo "не смог перезапустить себя"
          fi
