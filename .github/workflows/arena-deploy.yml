name: Арена Хаоса — деплой на Cloudflare

on:
  push:
    branches: [main]
    paths: ['arena-bot/**', '.github/workflows/arena-deploy.yml']
  workflow_dispatch:

concurrency: arena-deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: arena-bot
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Проверка секретов
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Нет секрета CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "${{ secrets.ARENA_BOT_TOKEN }}" || { echo "::error::Нет секрета ARENA_BOT_TOKEN"; exit 1; }
      - name: Деплой
        id: deploy
        run: |
          npx wrangler deploy 2>&1 | tee deploy.log
          URL=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          test -n "$URL" || { echo "::error::Не нашёл адрес воркера. Открой в Cloudflare раздел Workers & Pages один раз и перезапусти."; exit 1; }
          echo "url=$URL" >> "$GITHUB_OUTPUT"
      - name: Токен бота
        run: printf '%s' "${{ secrets.ARENA_BOT_TOKEN }}" | npx wrangler secret put BOT_TOKEN
      - name: Подключение бота (вебхук, команды, кнопка)
        env:
          URL: ${{ steps.deploy.outputs.url }}
          TOKEN: ${{ secrets.ARENA_BOT_TOKEN }}
        run: |
          KEY=$(printf 'arena-hook:%s' "$TOKEN" | sha256sum | cut -c1-40)
          for i in 1 2 3 4 5 6; do
            sleep 10
            CODE=$(curl -s -o setup.json -w '%{http_code}' "$URL/setup?key=$KEY")
            if [ "$CODE" = "200" ]; then python3 -c "import json;d=json.load(open('setup.json'));print('Бот:', (d.get('bot') or {}).get('username'), '| вебхук:', d.get('webhook'))"; echo "Игра: $URL"; exit 0; fi
            echo "попытка $i: $CODE"
          done
          exit 1
