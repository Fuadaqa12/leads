name: Поиск клиентов каждый день
on:
  schedule:
    - cron: "0 5 * * *"   # 09:00 по Баку
  workflow_dispatch:       # кнопка "Run workflow" для запуска вручную
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Найти новых клиентов и сделать демо-сайты
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: python autopilot.py
      - name: Сохранить и опубликовать
        run: |
          git config user.name "autopilot"
          git config user.email "autopilot@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "Новые клиенты $(date +%F)"
          git push
