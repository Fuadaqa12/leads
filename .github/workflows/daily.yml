name: Поиск клиентов каждый день
on:
  schedule:
    - cron: "0 5 * * *"   # 09:00 по Баку
  workflow_dispatch:       # кнопка "Run workflow" для запуска вручную
    inputs:
      rebuild:
        description: "Перегенерировать все демо-сайты (подтянуть фото/часы/отзывы из Google)"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: leads-data
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pillow (сжатие фото для демо)
        run: pip install pillow || true
      - name: Найти новых клиентов и сделать демо-сайты
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          if [ "${{ inputs.rebuild }}" = "true" ]; then python autopilot.py --rebuild 400; else python autopilot.py; fi
      - name: Поискать почту новых клиентов (для автописем)
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: python email_outreach.py find 60 || true
      - name: Сохранить и опубликовать
        run: |
          git config user.name "autopilot"
          git config user.email "autopilot@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "Новые клиенты $(date +%F)"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done
          exit 1
